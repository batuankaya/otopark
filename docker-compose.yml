# Opsiyonel: Lokal PostgreSQL kullanmak istemiyorsan `docker compose up -d` ile
# Postgres 16'yı container'da çalıştırabilirsin. Ayrıntı için README.md.
# Bu durumda .env içindeki DATABASE_URL portu 5433 olmalı.

services:
  db:
    image: postgres:16-alpine
    container_name: otopark-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: otopark
      # Şifre .env dosyasından okunur; varsayılan bırakılırsa uyarı verir.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: otopark_dev
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    ports:
      # 127.0.0.1'e bağlanır — YALNIZCA bu makineden erişilebilir.
      #
      # Önceden "5433:5432" yazıyordu; bu Docker'da 0.0.0.0'a bağlanmak
      # demektir ve aynı ağdaki (WiFi, mobil hotspot) herkes veritabanına
      # doğrudan bağlanıp tüm plakaları okuyabilir/silebilir. Uygulamanın
      # güvenlik önlemleri bu durumda tamamen atlanır.
      - "127.0.0.1:5433:5432"
    volumes:
      - otopark-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otopark -d otopark_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  otopark-pgdata:
